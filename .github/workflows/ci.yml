# ============================================================================
# prometheus-webhook CI pipeline
# Runs vet, test, lint (golangci-lint) and coverage on every push and PR.
# ============================================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Vet + Test + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          check-latest: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: make vet

      - name: Lint (golangci-lint)
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b $(go env GOPATH)/bin v1.64.8
          golangci-lint run ./...

      - name: Test
        run: make test

      - name: Coverage
        run: make coverage

      - name: Build (all platforms)
        run: make build-all
